version = 1

# First-party software by default: the Rust application workspace, the UI
# surface, the PostgreSQL migrations, the local development stack, the scripts,
# the end-to-end suite, the agent-context configuration and the supply-chain
# configuration. Locations are enumerated instead of globbed from the root, so a
# new top-level artefact class stays deliberately uncovered until it is
# reviewed. More permissive boundaries are declared below; the last matching
# annotation wins within this file.
[[annotations]]
path = [
  ".cargo/**",
  ".claude/**",
  ".env.example",
  ".gitignore",
  "Cargo.lock",
  "Cargo.toml",
  "crates/**",
  "deny.toml",
  "docker-compose.yml",
  "e2e/**",
  "goals.toml",
  "migrations/**",
  "scripts/**",
  "surfaces/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# Editorial documentation and first-party project records: decision records,
# plans, investigations, the readiness cockpit, the agent-context surface and
# the historical product-definition material kept under `_bmad/`.
[[annotations]]
path = ["*.md", "**/*.md", "LICENSE", "_bmad/**", "docs/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Interoperability schemas and the sample corpus. The export and sync schemas
# are published under a stable `$id` so that other implementations can produce
# and consume the same payloads; the `examples/` corpus is the synthetic test
# material that fixes their shape. Both exist to be re-implemented, and carry
# the permissive grant with its explicit patent clause.
[[annotations]]
path = ["examples/**", "schemas/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "Apache-2.0"

# Executable policy and first-party workflows stay reciprocal.
# `db-security-manifest.json` declares the tenant column, the database roles and
# the per-table data classification enforced fail-closed by the `db-inspection`
# workflow: it is runtime policy, not merely an interoperability contract, and
# not an editorial record.
[[annotations]]
path = [".github/**", "db-security-manifest.json"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# Design-system assets generated by the first-party `portal-forge` build and
# copied here as runtime UI assets. Their provenance (builder repository,
# revision and per-file digests) is recorded in `provenance.json` and
# `design-system.lock.json`. No third-party font binary is tracked in this
# repository: the CSS only names font families, and the upstream font files
# listed in the provenance statement are absent from the tree.
#
# These assets are the "client-facing design/web packages and application
# templates" line of the canonical policy, so they carry the permissive grant
# rather than the reciprocal default that surrounds them. The same emission is
# redistributed by sibling repositories of the organisation, where it is already
# published under `Apache-2.0`: `tokens.css`, `themes.css`, `components.css` and
# `contrast-report.json` are byte-identical across those copies. Declaring them
# reciprocal here would not produce reciprocity — a recipient simply takes the
# permissive copy — it would only misstate the grant offered on these bytes.
# The build metadata (`manifest.json`, `provenance.json`,
# `design-system.lock.json`) is annotated with the artefacts it describes, so
# the whole emitted bundle carries one licence.
[[annotations]]
path = ["surfaces/ui/assets/libre-ia/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "Apache-2.0"

# Grafted hub content and workspace bootstrap (ADR-0020, γ 3.5).
[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# Documentation keeps the frozen-home CC-BY-4.0 grant.
[[annotations]]
path = ["*.md", "**/*.md", "docs/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "CC-BY-4.0"
