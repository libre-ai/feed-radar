name: Dependency policy

# Reads `deny.toml` and `.cargo/audit.toml`, which until 2026-07-26 no tool in
# CI read at all. The waivers were reviewed, dated and gated for discipline by
# `scripts/advisory-waiver-gate.sh`, but nothing ever checked them against a
# dependency graph. The policy was impeccable and unenforced.
#
# THE WORKFLOW IS SPLIT IN TWO JOBS ON PURPOSE, ALONG THE ONLY LINE THAT
# MATTERS: whether a verdict can change without a commit.
#
#   `Dependency policy holds` — bans, licenses, sources. A pure function of the
#     committed tree: `Cargo.lock`, the workspace manifests, and licence
#     metadata of published crate versions, which is immutable. Run twice a
#     month apart on one commit, it gives one answer. This job is safe to
#     require, and is the one meant for branch protection.
#
#   `Advisory report` — advisories and yank status. A function of the RustSec
#     database, fetched at run time, and of crates.io yank flags that upstream
#     maintainers flip whenever they like. This job WILL go red one day with no
#     commit behind it. That is not a defect, it is the alert working — and it
#     is precisely why it must never be a required check.
#
# `scripts/advisory-waiver-gate.sh` deliberately refused to invoke a
# network-fetching scan so that a required check could not fail on upstream
# events. This workflow keeps that boundary rather than quietly crossing it: the
# advisory scan now runs, and it runs where a red mark informs instead of blocks.
#
# NOTE FOR THE REPOSITORY OWNER: add ONLY "Dependency policy holds" to the
# branch-protection required checks. Adding "Advisory report" would reintroduce
# the surprise-red failure mode that the waiver gate was written to avoid.
#
# Both tools are pinned by version AND SHA-256, following the pattern already
# used for `db-inspect` in `db-inspection.yml`: an unpinned tool is itself a
# way for a verdict to change without a commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DENY_VERSION: "0.19.5"
  DENY_ARCHIVE: cargo-deny-0.19.5-x86_64-unknown-linux-musl.tar.gz
  DENY_SHA256: 5ea64ae09959b5fe1072d898f95caaa89b374678ba6728d5e9ed1366745479b0
  AUDIT_VERSION: "v0.22.1"
  AUDIT_ARCHIVE: cargo-audit-x86_64-unknown-linux-musl-v0.22.1.tgz
  AUDIT_SHA256: c32506f338bdcdaef5a17fb9f33abb6ecf9561324cfd34237fd335f9283a1eab

jobs:
  dependency-policy:
    name: Dependency policy holds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo --version

      - name: Install pinned cargo-deny
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/cargo-deny target/cargo-deny
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${DENY_ARCHIVE}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "target/cargo-deny/${DENY_ARCHIVE}" "$url"
          printf '%s  %s\n' "$DENY_SHA256" "target/cargo-deny/${DENY_ARCHIVE}" \
            | sha256sum --check --strict
          tar -xzf "target/cargo-deny/${DENY_ARCHIVE}" -C .tools/cargo-deny --strip-components=1
          .tools/cargo-deny/cargo-deny --version
          printf '%s\n' "${GITHUB_WORKSPACE}/.tools/cargo-deny" >> "$GITHUB_PATH"

      # Populates the local registry so the licence check can read the crate
      # licence files. `--locked` refuses to alter Cargo.lock while doing it.
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked

      - name: Enforce bans, licenses and sources (fail closed)
        run: scripts/dependency-policy-gate.sh

  advisory-report:
    name: Advisory report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo --version

      - name: Install pinned cargo-deny and cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/cargo-deny .tools/cargo-audit target/tools
          deny_url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${DENY_ARCHIVE}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "target/tools/${DENY_ARCHIVE}" "$deny_url"
          printf '%s  %s\n' "$DENY_SHA256" "target/tools/${DENY_ARCHIVE}" \
            | sha256sum --check --strict
          tar -xzf "target/tools/${DENY_ARCHIVE}" -C .tools/cargo-deny --strip-components=1
          audit_url="https://github.com/rustsec/rustsec/releases/download/cargo-audit%2F${AUDIT_VERSION}/${AUDIT_ARCHIVE}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "target/tools/${AUDIT_ARCHIVE}" "$audit_url"
          printf '%s  %s\n' "$AUDIT_SHA256" "target/tools/${AUDIT_ARCHIVE}" \
            | sha256sum --check --strict
          tar -xzf "target/tools/${AUDIT_ARCHIVE}" -C .tools/cargo-audit --strip-components=1
          printf '%s\n' "${GITHUB_WORKSPACE}/.tools/cargo-deny" >> "$GITHUB_PATH"
          printf '%s\n' "${GITHUB_WORKSPACE}/.tools/cargo-audit" >> "$GITHUB_PATH"

      - name: Confirm both scanners are the pinned builds
        run: |
          cargo deny --version
          cargo audit --version

      - name: Fetch the locked dependency graph
        run: cargo fetch --locked

      # `--all-features` is the invocation the two `deny.toml` waivers were
      # measured against: under default features the optional `stripe` adapter
      # is unreachable and cargo-deny reports `advisory-not-detected` for both.
      - name: cargo deny — advisories over the feature-resolved graph
        id: deny_advisories
        continue-on-error: true
        run: cargo deny --locked --all-features check advisories

      # NOT redundant with the step above, and the difference is measured on
      # this tree. `cargo audit` reads `Cargo.lock`, which is feature-agnostic
      # and unfiltered, so it reaches crates cargo-deny drops from its resolved
      # graph — 42 of them under default features. `spin 0.9.8` is the live
      # example: genuinely yanked upstream, invisible to `cargo deny` at any
      # feature set because it is filtered out, and reported here. It is also
      # the only cover for `unsound` advisories, which cargo-deny never reports.
      # This is why `.cargo/audit.toml` and `deny.toml` both exist; deleting
      # either on the belief that the other is a superset would open a hole.
      - name: cargo audit — advisories over the whole lockfile
        id: audit
        continue-on-error: true
        run: cargo audit

      - name: Verdict
        shell: bash
        run: |
          set -euo pipefail
          deny="${{ steps.deny_advisories.outcome }}"
          audit="${{ steps.audit.outcome }}"
          {
            echo "### Advisory report (non-blocking)"
            echo ""
            echo "| scan | graph | outcome |"
            echo "| --- | --- | --- |"
            echo "| \`cargo deny check advisories --all-features\` | feature-resolved, filtered | ${deny} |"
            echo "| \`cargo audit\` | whole \`Cargo.lock\`, unfiltered | ${audit} |"
            echo ""
            echo "This job is advisory. It reads a database that changes without"
            echo "this repository changing, so it may turn red with no commit"
            echo "behind it. It must not be a required check."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "cargo deny advisories: ${deny}"
          echo "cargo audit:           ${audit}"
          if [ "$deny" != "success" ] || [ "$audit" != "success" ]; then
            echo "::warning::An advisory scan reported findings. This does not block merging; read the log and decide whether a waiver in deny.toml or .cargo/audit.toml needs updating."
            exit 1
          fi
          echo "Both advisory scans are clean against the current database."
