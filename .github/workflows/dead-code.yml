name: Dead code

# Fails when unreachable code reappears in the Rust workspace: a member no other
# member depends on and that builds no binary, a `[workspace.dependencies]` entry
# no member inherits, or a `.rs` file no `mod` declaration names.
#
# The same job also gates comment hygiene, because a statement parked behind
# `//` is unreachable code that no manifest or `mod` declaration can see, and
# advisory-waiver discipline, because an undated security waiver is a manifest
# declaration that outlives the reason it was granted — the same defect class,
# reached from `.cargo/audit.toml` and `deny.toml` instead of `Cargo.toml`. The
# three scripts are separate; they share this job so each check inherits the
# branch-protection requirement already attached to it. The job name below is
# the protected check identifier — renaming it silently drops the requirement.
#
# This is a hygiene gate, not the retired product CI: it runs `cargo metadata`
# and reads manifests, and never compiles the workspace.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreachable-code:
    name: No unreachable workspace code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect unreachable workspace code (fail closed)
        run: scripts/dead-code-gate.sh

      - name: Detect unreachable code in comments (fail closed)
        run: scripts/comment-hygiene-gate.sh

      - name: Detect undated or expired advisory waivers (fail closed)
        run: scripts/advisory-waiver-gate.sh
