# cargo-deny policy for rumble-feed-mind.
# Intent: permissive OSS only, no unknown registries, explicit advisory review.

[advisories]
version = 2
yanked = "warn"
ignore = [
  # Temporary waivers accepted in docs/adr/0005-dependency-advisory-waivers.md.
  # Both are inert under the default feature set — `cargo deny check` reports
  # them as `advisory-not-detected` — and both are load-bearing under
  # `cargo deny --all-features check advisories`, which fails on exactly these
  # two ids when the list is emptied. They are kept for that invocation rather
  # than deleted on the strength of the default-feature run.
  #
  # The per-entry `expires=` and `ref=` below are mandatory and enforced by
  # `scripts/advisory-waiver-gate.sh`; the dates must match `.cargo/audit.toml`
  # for the same id, which the same gate checks.
  "RUSTSEC-2026-0174", # http-types via the optional async-stripe feature, isolated from default/core builds; replace or remove the adapter before expiry (I4); expires=2026-09-30; ref=docs/adr/0005-dependency-advisory-waivers.md
  "RUSTSEC-2024-0384", # instant via the optional async-stripe feature, isolated from default/core builds; replace or remove the adapter before expiry (I4); expires=2026-09-30; ref=docs/adr/0005-dependency-advisory-waivers.md
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
# The `allow` list above is the INBOUND policy for third-party dependencies and
# is unchanged. The first-party workspace crates are OUTBOUND `EUPL-1.2` (see
# LICENSING at https://github.com/libre-ai/libre-ai/blob/main/LICENSING.md), so
# they are named one by one here instead of widening the inbound allow-list:
# a third-party EUPL dependency must still be reviewed explicitly.
exceptions = [
  { allow = ["EUPL-1.2"], crate = "feedmind-api" },
  { allow = ["EUPL-1.2"], crate = "feedmind-app" },
  { allow = ["EUPL-1.2"], crate = "feedmind-cli" },
  { allow = ["EUPL-1.2"], crate = "feedmind-crypto" },
  { allow = ["EUPL-1.2"], crate = "feedmind-domain" },
  { allow = ["EUPL-1.2"], crate = "feedmind-ingest" },
  { allow = ["EUPL-1.2"], crate = "feedmind-opml" },
  { allow = ["EUPL-1.2"], crate = "feedmind-rules" },
  { allow = ["EUPL-1.2"], crate = "feedmind-storage" },
  { allow = ["EUPL-1.2"], crate = "feedmind-sync" },
  { allow = ["EUPL-1.2"], crate = "feedmind-worker" },
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
  { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
