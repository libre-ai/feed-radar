[package]
name = "feedmind-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "feedmind-api"
path = "src/main.rs"

[dependencies]
# Internal
feedmind-crypto = { workspace = true }
feedmind-domain = { workspace = true }
feedmind-ingest = { workspace = true }
feedmind-opml = { workspace = true }
feedmind-storage = { workspace = true }

# Async
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower-http = { workspace = true }

# Database
sqlx = { workspace = true }

# Redis
redis = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Validation
validator = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Config
config = { workspace = true }
dotenvy = { workspace = true }

# UUID
uuid = { workspace = true }

# Date/Time
chrono = { workspace = true }

# Auth
argon2 = { workspace = true }
password-hash = { workspace = true }
jsonwebtoken = { workspace = true }

# Utils
base64 = { workspace = true }
regex = { workspace = true }

# HTTP client (for feed discovery)
reqwest = { workspace = true }

# Stripe payments (optional)
stripe = { package = "async-stripe", version = "0.39", features = ["runtime-tokio-hyper"], optional = true }

[dev-dependencies]
# Drives the assembled Router through a real request so that extractor-level
# refusals (status, headers, body) are proven at the HTTP boundary, not below it.
tower = { workspace = true }

[features]
default = []
stripe = ["dep:stripe"]
