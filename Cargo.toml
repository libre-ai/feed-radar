[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/domain",
    "crates/ingest",
    "crates/opml",
    "crates/rules",
    "crates/sync",
    "crates/storage",
    "crates/api",
    "crates/worker",
    "crates/cli",
    "surfaces/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
authors = ["Constantin Jais"]
repository = "https://github.com/libre-ai/feed-radar"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }
# Test-only: drives an assembled Router through one real request/response cycle.
# Already in the tree as an axum dependency, so no new supply-chain surface.
tower = { version = "0.5", features = ["util"] }

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "macros", "migrate", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# RSS/Atom parsing
feed-rs = "2.3"

# HTTP client
reqwest = { version = "0.13", features = ["json", "gzip"] }

# Redis
redis = { version = "1.3", features = ["tokio-comp", "connection-manager"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.15.25"
dotenvy = "0.15"

# UUID
uuid = { version = "1.11", features = ["v4", "serde", "js"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Password hashing
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }

# JWT
# `jsonwebtoken` 10.x resolves no crypto backend on its own: `sign` and `verify`
# both go through `CryptoProvider::get_default()`, which panics when neither the
# `rust_crypto` nor the `aws_lc_rs` feature is enabled. The feature is declared
# here, on the workspace dependency, so every member inherits a usable backend
# rather than compiling cleanly and aborting on the first token.
# `rust_crypto` is the owner's decision (docs/adr/0005). Exactly one provider may
# be enabled: the crate matches on `all(feature = "rust_crypto", not(feature =
# "aws_lc_rs"))`, so enabling both falls through to the same panic as enabling
# neither.
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }

# Encryption (for API keys)
aes-gcm = "0.11"
rand = "0.10"
hkdf = "0.13"
sha2 = "0.11"
base64 = "0.22"

# Regex
regex = "1.11"

# Cron scheduler
tokio-cron-scheduler = "0.15.1"

# Product UI
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals", "hooks", "asset", "document"] }
dioxus-ssr = "=0.7.9"

# Internal crates
feedmind-crypto = { version = "0.1.0", path = "crates/crypto" }
feedmind-domain = { version = "0.1.0", path = "crates/domain" }
feedmind-ingest = { version = "0.1.0", path = "crates/ingest" }
feedmind-opml = { version = "0.1.0", path = "crates/opml" }
feedmind-rules = { version = "0.1.0", path = "crates/rules" }
feedmind-sync = { version = "0.1.0", path = "crates/sync" }
feedmind-storage = { version = "0.1.0", path = "crates/storage" }

[profile.release]
lto = true
codegen-units = 1
strip = true
